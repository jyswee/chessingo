    <!-- Metallic gold: a bright upper face, one crisp catch line just below the
         optical centre, then a warm amber underside. The catch line is what
         sells it as metal rather than as a flat gradient. -->
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.00" stop-color="#fff6cf"/>
      <stop offset="0.26" stop-color="#ffe074"/>
      <stop offset="0.49" stop-color="#ffc62e"/>
      <stop offset="0.50" stop-color="#ffb01c"/>
      <stop offset="0.72" stop-color="#ffcf52"/>
      <stop offset="1.00" stop-color="#e08a0b"/>
    </linearGradient>

    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.00" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.26" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="0.38" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="bloomM" x="-30%" y="-120%" width="160%" height="340%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
    <filter id="bloomC" x="-25%" y="-90%" width="150%" height="280%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>

    <clipPath id="clipWord"><use href="#w"/></clipPath>
  </defs>

  <g transform="translate(300,980)">
    <!-- 1. magenta bloom sits behind everything, widest and softest -->
    <g filter="url(#bloomM)" opacity="0.95"><use href="#w" fill="#ff2d78"/></g>

    <!-- 2. stepped extrude for depth (what the old flat wordmark lacked) -->
      <use href="#w" x="80" y="80" fill="#4a0d5e"/>
      <use href="#w" x="72" y="72" fill="#450c58"/>
      <use href="#w" x="64" y="64" fill="#3f0c52"/>
      <use href="#w" x="56" y="56" fill="#3a0b4d"/>
      <use href="#w" x="48" y="48" fill="#340a47"/>
      <use href="#w" x="40" y="40" fill="#2f0a41"/>
      <use href="#w" x="32" y="32" fill="#2a093b"/>
      <use href="#w" x="24" y="24" fill="#240835"/>
      <use href="#w" x="16" y="16" fill="#1f0730"/>
      <use href="#w" x="8" y="8" fill="#19072a"/>

    <!-- 3. cyan rim light AFTER the extrude, or the extrude's offset copies
         paint straight over it and only a sliver survives up-left. Nudged
         against the extrude direction so it reads as a light source. -->
    <g filter="url(#bloomC)" opacity="0.95">
      <use href="#w" x="-10" y="-10" fill="#3fd8ff"/>
    </g>

    <!-- 4. navy keyline, drawn under the face via paint-order -->
    <use href="#w" fill="url(#gold)" stroke="#1a0b36" stroke-width="30"
         stroke-linejoin="round" paint-order="stroke"/>

    <!-- 5. specular band across the upper third, clipped to the letters -->
    <g clip-path="url(#clipWord)">
      <rect x="-40" y="-740" width="7012" height="760" fill="url(#shine)"/>
    </g>

    <!-- 6. a cyan inner edge to tie the gold back to the palette -->
    <use href="#w" fill="none" stroke="#9ff0ff" stroke-width="7" opacity="0.65"/>
  </g>
